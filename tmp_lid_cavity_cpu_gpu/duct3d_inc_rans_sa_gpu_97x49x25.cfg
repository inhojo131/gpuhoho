%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Generated 3D incompressible RANS-SA rectangular duct.
% Existing GPU BCGSTAB/Jacobi comparison.
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= INC_RANS
KIND_TURB_MODEL= SA
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
ENABLE_CUDA= YES

TIME_MARCHING= NO

INC_DENSITY_MODEL= CONSTANT
INC_ENERGY_EQUATION= NO
INC_DENSITY_INIT= 1.0
INC_VELOCITY_INIT= ( 0.1, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 300.0
INC_NONDIM= INITIAL_VALUES
INC_DENSITY_REF= 1.0
INC_VELOCITY_REF= 1.0
INC_TEMPERATURE_REF= 1.0
INC_INLET_TYPE= VELOCITY_INLET
INC_INLET_DAMPING= 0.01
INC_OUTLET_TYPE= PRESSURE_OUTLET
INC_OUTLET_DAMPING= 0.01

VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.0E-2

REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 1.0

MARKER_HEATFLUX= ( y_plus, 0.0, y_minus, 0.0, z_plus, 0.0, z_minus, 0.0 )
MARKER_INLET= ( x_minus, 300.0, 0.1, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( x_plus, 0.0 )
MARKER_PLOTTING= ( y_plus, y_minus, z_plus, z_minus )
MARKER_MONITORING= ( y_plus, y_minus, z_plus, z_minus )

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.02
CFL_ADAPT= NO
ITER= 300

LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_PREC= JACOBI
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 20

MGLEVEL= 0
MGCYCLE= V_CYCLE
MG_PRE_SMOOTH= ( 1, 1, 1, 1 )
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
MG_DAMP_RESTRICTION= 0.9
MG_DAMP_PROLONGATION= 0.9

CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= NONE
JST_SENSOR_COEFF= ( 0.5, 0.02 )
TIME_DISCRE_FLOW= EULER_IMPLICIT

CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
SLOPE_LIMITER_TURB= VENKATAKRISHNAN
TIME_DISCRE_TURB= EULER_IMPLICIT

CONV_RESIDUAL_MINVAL= -12
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-12

MESH_FORMAT= BOX
MESH_BOX_SIZE= (97, 49, 25)
MESH_BOX_LENGTH= (3.0, 1.0, 0.5)
MESH_BOX_OFFSET= (0.0, 0.0, 0.0)
MESH_OUT_FILENAME= mesh_out_duct3d_inc_rans_sa_gpu_97x49x25
SOLUTION_FILENAME= solution_duct3d_inc_rans_sa_gpu_97x49x25
SOLUTION_ADJ_FILENAME= solution_adj
TABULAR_FORMAT= CSV
CONV_FILENAME= history_duct3d_inc_rans_sa_gpu_97x49x25
RESTART_FILENAME= restart_duct3d_inc_rans_sa_gpu_97x49x25
RESTART_ADJ_FILENAME= restart_adj
VOLUME_FILENAME= flow_duct3d_inc_rans_sa_gpu_97x49x25
